<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Piste « face » : tête d'ornithorynque de face, bleu Platyplus + bec or plus large que la tête, « plus » or -->
